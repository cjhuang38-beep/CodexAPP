[project]
name = "gmail-summary-desktop"
version = "0.1.0"
description = "繁體中文 Gmail 分類與摘要桌面 App"
requires-python = ">=3.11,<3.14"
dependencies = [
  "customtkinter==5.2.2",
  "pillow==12.1.0",
  "google-api-python-client==2.187.0",
  "google-auth-oauthlib==1.2.3",
  "keyring==25.7.0",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.3",
  "platformdirs==4.5.1",
  "tzdata==2025.3",
]

[dependency-groups]
dev = ["pytest==9.0.2", "pyinstaller==6.17.0", "ruff==0.14.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
